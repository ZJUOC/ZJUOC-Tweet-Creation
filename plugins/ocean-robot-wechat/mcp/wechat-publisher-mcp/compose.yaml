services:
  wechat-publisher-mcp:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_STATE_PATH: /data/state.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wechat-publisher-data:/data

volumes:
  wechat-publisher-data:
